# Checks run on merge requests, on main and on release tags before anything
# is published.
#   main push            → :main and the write-once 8-character commit tag
#   tag vX.Y.Z           → release guard, then :vX.Y.Z (immutable), the commit
#                          tag (when new), :vMAJOR, :latest within its major
#                          line, install.sh (the no-clone installer) and a
#                          GitLab Release
#   promote-latest       → manual job of a tag pipeline: :latest moves to that
#                          release across majors
#   tag vX.Y.Z-rc.N      → a pre-release (-alpha.N, -beta.N, -rc.N; on main or
#                          an integ/* branch): release guard, then
#                          :vX.Y.Z-rc.N (immutable), the commit tag (when
#                          new), install.sh and a GitLab Release named
#                          "vX.Y.Z-rc.N (pre-release)". Never :vMAJOR or
#                          :latest, and no promote-latest job.
# :latest never moves to a new major automatically: deployments that still
# pull :latest stay on their major line until someone upgrades on purpose.
# Release logic lives in scripts/release.sh (tested by scripts/test-release.sh).
# build-main and release-build start with the tests; the jobs that publish
# (publish-main, release-publish, and through them promote-latest and
# release-notes) need every test job of the pipeline (a tag's: and the
# release guard) as well as the build: nothing is published unless all of
# them passed. The image jobs build the Containerfile with RUN_CHECKS=false
# (see .image-build).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR is tested by the MR pipeline only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH
    # Release and pre-release tags only; other tags run no pipeline. The
    # pattern is RE2 (GitLab docs, ci/jobs/job_rules.md, "Compare a variable
    # to a regular expression"); release-guard then refuses a pre-release
    # number 0 or with a leading zero.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$/

stages:
  - test
  - build
  - publish
  - release

variables:
  # The image repository, without a tag. A project CI/CD variable named
  # IMAGE overrides this default (with QUAY_USER / QUAY_TOKEN for its
  # registry).
  IMAGE: quay.io/juntao_wang/rhoai-nightly-updater
  # Where Docker Hub images come from: the job images below and the
  # Containerfile's node and golang bases (build arg DOCKER_HUB). Docker Hub
  # limits anonymous pulls per IP, which shared runners hit ("toomanyrequests"),
  # so they come from mirror.gcr.io, Google's public cache of Docker Hub, which
  # needs no login; pulls from it do not count against Docker Hub's limits
  # (Google, Artifact Registry "Pull cached Docker Hub images": "Pulling
  # cached images does not count against Docker Hub rate limits"). The
  # digests below pin the images,
  # so the mirror serves exactly the same content or nothing. The mirror holds
  # only images people pull often: if a new digest is not there yet, the job
  # fails to pull it; set a project CI/CD variable DOCKER_HUB to docker.io, or
  # to GitLab's Dependency Proxy (a cache in the group: group Settings >
  # Packages and registries > Dependency Proxy > Enable Proxy, Owner role;
  # value $CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX with "Expand variable
  # reference" on; runners and the image jobs log in to it with the job's own
  # credentials).
  DOCKER_HUB: mirror.gcr.io
  # Images pinned by digest; keep in step with the Containerfile.
  GO_IMAGE: $DOCKER_HUB/library/golang:1.27.4@sha256:5e8afd493a7124a8586e134d9b532731161d4b9becf9dee5a5956b107426f93d
  NODE_IMAGE: $DOCKER_HUB/library/node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  GOLANGCI_IMAGE: $DOCKER_HUB/golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
  # buildah builds the image (scripts/ci-build-image.sh); the multi-arch
  # index of the upstream image, which rebuilds the tag: the digest pins it.
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.46.1@sha256:12132e724a8a5c7e6970c3fced03f3db6c8077d9afa08803df274df4cf3de846
  # The scheduled renovate job (renovate.json5).
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.254.1@sha256:42f31a79fd1dc7ce0a3e4da42a7e57a80443fd9a3401c5b2631d76bc8b4a40dd
  # crane (go-containerregistry) moves and reads tags in the publish jobs:
  # the release tarball of this version for linux/amd64, checked against its
  # SHA-256 before use (the release's checksums.txt, which GitHub's asset
  # digest and the release's SLSA provenance, multiple.intoto.jsonl, also
  # name). Change both together. The runner is amd64: the chart's helm
  # linux-amd64 binary runs there.
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  # Helm renders the chart in the script-tests job: the release tarball of this
  # version, checked against its SHA-256 (get.helm.sh, also in the release
  # notes) before use. Keep in step with .github/workflows/ci.yml.
  HELM_VERSION: v3.22.1
  HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea

# Pipeline schedules run the renovate job only (end of this file): the test
# jobs skip them, and so do the image jobs (a second build of a commit
# would make publish-main refuse its commit tag).
# Job timeouts, from the successful jobs of 2026-10-30..11-20 (VM start
# included): test jobs p90 at most 7.5 min (go 435 s, max 527 s), so 20 min;
# go test's own 10-minute limit then still ends a hung test with its stack
# first. Without them a job runs to the project's 60 minutes.
.test:
  stage: test
  interruptible: true
  timeout: 20m
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# Go's module and build caches live in .cache/ (GitLab caches only paths in
# the project directory; `./...` skips directories starting with a dot), one
# cache per job and go.sum: the go job builds with -race, golangci-lint
# without. Build cache entries are keyed by the hash of their inputs, so a
# hit is what a fresh build would produce, and test results are never
# reused (-count=1). `go mod verify` checks the restored modules against
# go.sum. Protected refs (main, release tags) get a cache of their own.
#
# The runner uploads the cache again whenever a file in it is newer than the
# restored archive, and Go touches every build cache entry it uses (at most
# once an hour, cmd/go/internal/cache markUsed), so every run uploads it:
# 20-86 s at the end of the go job. A tag pipeline only reads it: its commit
# went through main (or an integ/* branch) first, whose pipeline wrote the
# same key (go.sum, protected). Branch pipelines keep writing: a pipeline
# started by a Developer gets keys with the suffix non_protected, which
# main never writes (GitLab docs, ci/caching, "Cache key names").
# GO_CACHE_POLICY must always be set: the runner fails a job whose policy
# expands to anything but pull, push or pull-push.
.go-cache:
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GO_CACHE_POLICY: pull-push
  cache:
    key:
      files: [go.sum]
      prefix: $CI_JOB_NAME
    paths: [.cache/go-mod/, .cache/go-build/]
    policy: $GO_CACHE_POLICY
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        GO_CACHE_POLICY: pull
    - when: on_success

go:
  extends: [.test, .go-cache]
  image: $GO_IMAGE
  script:
    # gofmt (without the caches in .cache/), go mod verify, go vet, the race
    # tests (scripts/test-go.sh), govulncheck; `make ci-go` locally.
    - make ci-go

golangci-lint:
  extends: [.test, .go-cache]
  image: $GOLANGCI_IMAGE
  variables:
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  cache:
    key:
      files: [go.sum]
      prefix: $CI_JOB_NAME
    paths: [.cache/go-mod/, .cache/go-build/, .cache/golangci-lint/]
    policy: $GO_CACHE_POLICY
  script:
    - go mod verify
    # The tree is lint-clean: every issue fails the pipeline.
    - golangci-lint run ./...

# The frontend's jobs (checks, frontend-test, frontend-build) run in
# parallel, each with its own npm ci from one npm cache (keyed on
# package-lock.json): the tests take longest, and the other two finish
# within their time. Only checks uploads the cache; the others only read
# it. The key needs its prefix: without one GitLab names it after the file,
# "0_frontend/package-lock-<sha>" (lib/gitlab/ci/build/cache.rb,
# cache_prefix), and the runner refuses to restore a key with a "/"
# ("must not contain '/'", gitlab-runner shells/abstract.go,
# sanitizeCacheKey), so the cache was uploaded but never read.
.frontend:
  extends: .test
  image: $NODE_IMAGE
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: npm
    paths: [frontend/.npm/]
    policy: pull
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

# A job's runner VM takes about two minutes to start (prepare_executor
# 104-134 s in the job logs) and the docs, chart and script checks ran for
# 5-28 s each, so they share jobs: checks (the frontend's typecheck, ESLint
# and npm audit; the docs' links, anchors and images; shellcheck on every
# shell script) and script-tests (the release, install, node pull secret and
# test-go.sh script tests, and the Helm chart). Each runs `make -k` on its Makefile
# target, as `make -k ci-checks` / `make -k ci-script-tests` do locally:
# every part runs even when an earlier one fails, make names each failing
# part ("make: *** [Makefile:NN: docs-check] Error 1"), and the job fails at
# the end. Alpine's make 4.4 and shellcheck 0.11.0, with whichever Alpine
# revision the pinned image's release serves.
checks:
  extends: .frontend
  cache:
    policy: pull-push
  before_script:
    - apk add --no-cache 'make~4.4' 'shellcheck~0.11.0' >/dev/null
    - shellcheck --version
    - (cd frontend && npm ci --cache .npm --prefer-offline)
  script:
    - make -k ci-checks

frontend-test:
  extends: .frontend
  script:
    - npm test

frontend-build:
  extends: .frontend
  script:
    - npm run build

# The Go image (Debian) has no jq or helm. Debian's jq 1.7.1, with whichever
# Debian security revision the pinned image's release serves; Helm's release
# tarball of HELM_VERSION, checked against HELM_SHA256 before use. The
# target sets REQUIRE_JQ=1 and REQUIRE_HELM=1, so a missing tool fails the
# job instead of skipping tests. The chart tests (scripts/test-chart.sh):
# the chart's copies of deploy/template.yaml and deploy/rbac-gitops.yaml,
# helm lint and helm template.
script-tests:
  extends: .test
  image: $GO_IMAGE
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends 'jq=1.7.1-*' >/dev/null
    - jq --version
    - curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
    - echo "$HELM_SHA256  /tmp/helm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - helm version
    - make -k ci-script-tests

# A warning, never a failure: the docs images whose sources have commits
# after the image was captured (make docs-stale, docs/tools/images.manifest).
# Branches do not regenerate docs images; the release pass does, and
# release-guard stops a final release while one is stale. Git only, in the
# Go image; it needs the whole history to find each image's capture commit.
# Nothing needs it, so it never holds up a build or a publish.
docs-stale:
  extends: .test
  image: $GO_IMAGE
  timeout: 10m
  variables:
    GIT_DEPTH: "0"
  allow_failure: true
  script:
    - make docs-stale

# Fails a tag pipeline before anything is published: the tag must
# match the top dated section of CHANGELOG.md (a pre-release: the top
# undated one), a TEMPLATE_REVISION change since the previous release
# tag (pre-releases do not count) needs a higher MAJOR version, and a final
# release needs docs images captured after their sources' last change (a
# pre-release only warns; docs/tools/stale-images.sh).
release-guard:
  extends: .test
  image: $GO_IMAGE
  variables:
    # The guard compares with the previous release tag: full history, all tags.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune --quiet --tags
  script:
    - make release-check TAG="$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# The image jobs build with RUN_CHECKS=false: the Containerfile then skips
# its own copy of the checks (frontend typecheck, lint and tests; go vet and
# go test) but still installs and builds everything. build-main and
# release-build start at once, alongside the test jobs (needs: []), and
# build only a tarball: the publish jobs `need` the test jobs of this
# pipeline, which ran those checks (and more: -race, govulncheck,
# golangci-lint) on this same commit, so a failing check stops the pipeline
# before anything is pushed (GitLab docs, ci/yaml "needs": a job runs when
# every job it needs has finished; an empty array starts it with the
# pipeline). A red pipeline still has built the tarball (an artifact for a
# day, never pushed). build-main is interruptible like the tests, so a
# newer push to main still cancels the older pipeline until publish-main
# starts (auto-cancel stops a pipeline only while every running job is
# interruptible: ci/yaml "interruptible"). build-branch, which pushes in
# its own job, still needs the tests. `make build` keeps the checks on.
#
# The build is scripts/ci-build-image.sh: buildah, chroot isolation, vfs
# storage, linux/amd64, no layer cache (each job starts from an empty
# storage, as kaniko did without --cache).
#
# The image jobs have no tags. GitLab.com's hosted runners are off for this
# project (project API: shared_runners_enabled=false); the job logs show
# the redhat/ai group runner ("on pe-runners ...", executor docker+machine;
# it has tag aipcc and takes untagged jobs). Whether it runs jobs
# privileged is set by its owners and not visible to this project:
# ci-build-image.sh prints the job's CapEff and the block devices in /dev,
# so the build log tells. buildah needs a privileged container, or
# seccomp=unconfined plus label=disable (buildah v1.46.1 in Podman 5.2.5,
# SELinux enforcing, 2026-11-19). With Docker's default seccomp profile
# (moby 29.10.0's) it stops at its start ("Error during
# unshare(CLONE_NEWUSER): Operation not permitted"); with SELinux labels
# at the first RUN ("masking non-directory .../proc/interrupts ...
# permission denied"). Either way nothing is pushed: a runner that allows
# neither makes the image jobs fail. CONTRIBUTING.md, Automatic Image
# Publishing.
#
# The build never uses the release credentials (QUAY_USER/QUAY_TOKEN): the
# script does not read them, and build-main and release-build log in to no
# registry but the Dependency Proxy (when DOCKER_HUB points at it); the
# crane jobs below push their tarballs. build-branch logs in to
# BRANCH_IMAGE's registry only after the build. The RUN steps (npm ci with
# its packages' install scripts, go mod download) run chrooted with
# buildah's default capabilities (no CAP_SYS_PTRACE): the auth file is
# outside the chroot, /proc lists the job's processes and the kernel
# refuses reading their environ. On a privileged runner /dev in a RUN step
# holds the host's block devices, and a RUN step can read them (rootful
# Podman --privileged, 2026-11-19). So the build's isolation is not what
# keeps the push token from it: the environment scope of QUAY_* is (they
# reach only the quay-publish jobs, .crane below; SECURITY.md).
# p90 575 s (build-main) and 566 s (release-build), max 691 s.
.image-build:
  stage: build
  image: $BUILDAH_IMAGE
  timeout: 30m

# Push to main → an image tarball; publish-main pushes it as the write-once
# 8-character commit tag (CI_COMMIT_SHORT_SHA) and moves :main. Never
# :latest: that only moves with releases.
build-main:
  extends: .image-build
  needs: []
  interruptible: true
  script:
    - sh scripts/ci-build-image.sh tarball "$CI_COMMIT_SHORT_SHA" image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"


# Manual trigger for any other branch: builds the image, and pushes it as
# $BRANCH_IMAGE:<branch-slug> only when the project has the branch
# variables BRANCH_IMAGE, QUAY_BRANCH_USER and QUAY_BRANCH_TOKEN (a robot
# account that can write only that repository; CONTRIBUTING.md). It never
# uses QUAY_USER/QUAY_TOKEN, which can push the release tags: anyone who
# can push a branch can run this job with code of their own.
build-branch:
  extends: .image-build
  needs: [go, golangci-lint, checks, frontend-test, frontend-build, script-tests]
  script:
    - sh scripts/ci-build-image.sh branch "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      allow_failure: true

# Tag vX.Y.Z → an image tarball; nothing is pushed here. release-publish
# pushes it under the publish lock, so the "tag already exists" check and
# the push cannot interleave with another release job.
release-build:
  extends: .image-build
  needs: []
  script:
    - sh scripts/ci-build-image.sh tarball "$CI_COMMIT_TAG" image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

# Tag vX.Y.Z → install.sh, the no-clone installer: scripts/install.sh with
# this tag's deploy/template.yaml, commit and version embedded. Kept
# forever; the GitLab Release links it.
release-installer:
  stage: build
  image: $GO_IMAGE
  timeout: 10m
  needs: [script-tests, release-guard]
  script:
    - sh scripts/release.sh installer "$CI_COMMIT_TAG" HEAD > install.sh
    - bash -n install.sh
    - test "$(bash install.sh --print-version)" = "$CI_COMMIT_TAG"
    - bash install.sh --print-template | cmp - deploy/template.yaml
    - sha256sum install.sh
    # release-notes links this job's artifact by job ID.
    - echo "INSTALLER_JOB_ID=$CI_JOB_ID" > installer.env
  artifacts:
    paths: [install.sh]
    expire_in: never
    reports:
      dotenv: installer.env
  rules:
    - if: $CI_COMMIT_TAG

# The crane jobs use no cache and build nothing: a Go cache for `go install`
# of crane could be written by a pipeline of any branch started by a
# Maintainer (the same key and protected suffix), and it ran right before
# `crane auth login` with the push token.
.crane:
  image: $GO_IMAGE
  timeout: 10m
  # Every job that writes image tags (publish-main, release-publish,
  # promote-latest) holds this one lock, so their "does the tag exist"
  # checks and writes never interleave
  # (https://docs.gitlab.com/ci/resource_groups/). Its process mode is
  # GitLab's default, unordered (resource groups API, 2026-11-20): waiting
  # jobs run in no set order. The jobs do not rely on an order: :main moves
  # only while the job's commit is the tip of main, a release moves :vN and
  # :latest only to a newer version, and commit and release tags are written
  # once. A Maintainer can still choose newest_first with the API (it cannot
  # be set in this file):
  #   PUT /projects/:id/resource_groups/publish-latest  process_mode=newest_first
  resource_group: publish-latest
  # QUAY_USER/QUAY_TOKEN are meant to be scoped to this environment in the
  # project's CI/CD variables (Environment scope: quay-publish), so only the
  # crane jobs receive them; every other job of a main or tag pipeline,
  # including npm ci with its packages' install scripts, does not.
  # action: access records no deployment. Set that scope only after this
  # file (with the environment) is on main and its first publish-main has
  # pushed: earlier .crane jobs declare no environment and would get no
  # QUAY_* (CONTRIBUTING.md, GitLab and Quay settings).
  environment:
    name: quay-publish
    action: access
  before_script:
    - curl -fsSLo /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
    - echo "$CRANE_SHA256  /tmp/crane.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
    - crane version
    - printf '%s' "$QUAY_TOKEN" | crane auth login "${IMAGE%%/*}" -u "$QUAY_USER" --password-stdin

# Main: the write-once commit tag (kept when it exists from this commit,
# refused from another) and :main while the commit is still the tip of the
# default branch, read from the Git smart HTTP ref advertisement with the
# job token. If the tip cannot be read the job fails, and a retry checks
# again.
publish-main:
  extends: .crane
  stage: publish
  needs: [build-main, go, golangci-lint, checks, frontend-test, frontend-build, script-tests]
  script:
    - IMAGE_TARBALL=image.tar sh scripts/release.sh publish-main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"

# Pushes :vX.Y.Z (refused when it exists from another commit: release tags
# are immutable), the commit tag when main has not published it, :vMAJOR
# when this is the newest release of its major, and :latest when this is
# newer than :latest within the same major (a :latest without a version
# label counts as v1). A pre-release pushes its own tag and the commit tag
# only.
release-publish:
  extends: .crane
  stage: publish
  needs: [release-build, go, golangci-lint, checks, frontend-test, frontend-build, script-tests, release-guard]
  script:
    - IMAGE_TARBALL=image.tar sh scripts/release.sh publish "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# A GitLab Release with the CHANGELOG section, install.sh (and its SHA-256)
# and a link to this tag's deploy/template.yaml (a pre-release's is named
# "vX.Y.Z-rc.N (pre-release)": GitLab has no pre-release flag). Uses the job token; an
# existing Release is kept. After release-publish, so a Release never
# points at an image that was not published.
release-notes:
  stage: release
  image: $GO_IMAGE
  timeout: 10m
  needs: [release-publish, release-installer]
  script:
    - INSTALLER=install.sh sh scripts/release.sh gitlab-release "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

# MANUAL, deliberate: move :latest to this release even when it is a new
# major version. Every deployment that still pulls :latest gets this
# version on its next restart and needs this release's template
# (git checkout <tag> && make upgrade), so announce it first. Release tags
# only: a pre-release pipeline has no such job (and release.sh refuses one).
promote-latest:
  extends: .crane
  stage: release
  needs: [release-publish]
  script:
    - sh scripts/release.sh promote-latest "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true

# Self-hosted Renovate (renovate.json5): weekly dependency merge requests.
# Inert until a Maintainer adds the project variable RENOVATE_TOKEN (a bot
# token, protected and masked, Environment scope renovate) and a pipeline
# schedule on main with the schedule variable RENOVATE_RUN=1; a schedule
# pipeline runs this job only. Optional GITHUB_COM_TOKEN (protected, masked,
# a GitHub token with no scopes; Renovate also takes the name
# RENOVATE_GITHUB_COM_TOKEN, per lib/workers/global/config/parse/env.ts
# line 333 at 44.254.1)
# for the GitHub Actions, Go and Node version lookups and release notes.
# CONTRIBUTING.md, Dependency updates.
#
# The rule tests RENOVATE_RUN, not RENOVATE_TOKEN: GitLab's docs say "You
# should not use environment-scoped variables with rules or include. The
# variables might not be defined when GitLab validates the pipeline
# configuration at pipeline creation" (doc/ci/environments/_index.md).
renovate:
  stage: test
  image: $RENOVATE_IMAGE
  needs: []
  # RENOVATE_TOKEN (and GITHUB_COM_TOKEN) scoped to this environment, as
  # QUAY_* are to quay-publish: no other job receives them.
  environment:
    name: renovate
    action: access
  variables:
    # Renovate clones the project itself, with the bot token.
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    LOG_LEVEL: info
  script:
    - test -n "$RENOVATE_TOKEN" || { echo "RENOVATE_TOKEN is not set for this job (Environment scope renovate; CONTRIBUTING.md, Dependency updates)."; exit 1; }
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN
