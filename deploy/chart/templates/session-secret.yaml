{{- /*
The oauth-proxy cookie secret, Secret <APP_NAME>-proxy (key session_secret),
which the Template's Deployment mounts but does not create: install.sh
creates it once and never replaces it, so sessions survive upgrades. Helm
cannot do that under Argo CD (`helm template` has no lookup, and a random
value would change on every render), so a Sync hook Job creates it before
the Template's objects (wave -1, they are wave 0) when it does not exist,
and leaves an existing one alone. Argo CD does not track the Secret, so it
never prunes it either. With gitops.sessionSecret.enabled=false the Secret
must exist before the first sync (docs/GITOPS.md).
*/ -}}
{{- if .Values.gitops.sessionSecret.enabled }}
{{- $p := include "rnu.params" . | fromJson }}
{{- $name := printf "%s-session-secret" $p.APP_NAME }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ $p.NAMESPACE | quote }}
  annotations:
    {{- include "rnu.hook" (dict "phase" "Sync" "wave" "-2") | nindent 4 }}
---
# Read the one Secret by name; "create" cannot be limited to a name
# (https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name | quote }}
  namespace: {{ $p.NAMESPACE | quote }}
  annotations:
    {{- include "rnu.hook" (dict "phase" "Sync" "wave" "-2") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-proxy" $p.APP_NAME | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name | quote }}
  namespace: {{ $p.NAMESPACE | quote }}
  annotations:
    {{- include "rnu.hook" (dict "phase" "Sync" "wave" "-2") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $name | quote }}
    namespace: {{ $p.NAMESPACE | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name | quote }}
  namespace: {{ $p.NAMESPACE | quote }}
  annotations:
    {{- include "rnu.hook" (dict "phase" "Sync" "wave" "-1") | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      # Not the app's "app" label: the Service and NetworkPolicy select it.
      labels:
        app.kubernetes.io/part-of: {{ $p.APP_NAME | quote }}
        app.kubernetes.io/component: session-secret
    spec:
      serviceAccountName: {{ $name | quote }}
      restartPolicy: Never
      securityContext:
        {{- include "rnu.hookPodSecurity" . | nindent 8 }}
      containers:
        - name: session-secret
          image: {{ .Values.gitops.cliImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ $p.NAMESPACE | quote }}
            - name: SECRET
              value: {{ printf "%s-proxy" $p.APP_NAME | quote }}
            # oc writes its cache under HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          # The value is generated as install.sh does it (32 alphanumerics),
          # kept in a memory-backed volume, and never printed.
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              umask 077
              if out=$(oc get secret "$SECRET" -n "$NAMESPACE" -o name 2>&1); then
                echo "Secret $SECRET exists; keeping it."
                exit 0
              fi
              case "$out" in
              *NotFound* | *"not found"*) ;;
              *)
                echo "Cannot read Secret $SECRET: $out" >&2
                exit 1
                ;;
              esac
              secret=$(head -c 64 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
              if [ ${#secret} -ne 32 ]; then
                echo "Could not produce a 32-character cookie secret" >&2
                exit 1
              fi
              printf '%s' "$secret" >/secret/session_secret
              unset secret
              if out=$(oc create secret generic "$SECRET" -n "$NAMESPACE" --from-file=session_secret=/secret/session_secret -o name 2>&1); then
                echo "Created Secret $SECRET."
              elif [[ $out == *AlreadyExists* ]]; then
                echo "Secret $SECRET was created meanwhile; keeping it."
              else
                echo "Cannot create Secret $SECRET: $out" >&2
                exit 1
              fi
          resources:
            {{- include "rnu.hookResources" . | nindent 12 }}
          securityContext:
            {{- include "rnu.hookContainerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secret
              mountPath: /secret
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: secret
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
