apiVersion: v2
name: rhoai-nightly-updater
description: >-
  The RHOAI Nightly Updater for Argo CD: renders deploy/template.yaml (the
  OpenShift Template install.sh applies) and replaces install.sh's
  imperative steps with hooks. See docs/GITOPS.md.
type: application
# The release this chart belongs to, as in CHANGELOG.md: scripts/release.sh
# check refuses a release tag whose version is not this one. Install the
# chart from a release tag (targetRevision vX.Y.Z), with that release's image.
version: 2.2.1
appVersion: "v2.2.1"
home: https://github.com/DaoDaoNoCode/rhoai-nightly-updater
sources:
  - https://gitlab.com/redhat/ai/rhoai-dashboard-team/rhoai-nightly-updater
  - https://github.com/DaoDaoNoCode/rhoai-nightly-updater
