apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhoai-nightly-updater
  annotations:
    description: >-
      RHOAI Nightly Updater. Requires cluster-admin to apply. Before the first
      apply, create the oauth-proxy session secret and the OAuth client
      secret once (both are kept across re-applies, so sessions survive
      upgrades):
      oc create secret generic <APP_NAME>-proxy -n <NAMESPACE>
      --from-literal=session_secret="$(head -c 64 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)";
      oc create secret generic <APP_NAME>-oauth-client -n <NAMESPACE>
      --from-literal=client-secret="$(head -c 64 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)".
      After the apply, create the OAuthClient <APP_NAME>-<NAMESPACE> that
      users sign in with (grantMethod auto, redirect URI
      https://<Route host>/oauth/callback, that client secret).
      `make deploy` / `make upgrade` (scripts/install.sh) do all of this for
      you.
parameters:
  - name: IMAGE
    required: true
  - name: NAMESPACE
    value: rhoai-nightly-updater
  - name: APP_NAME
    value: rhoai-nightly-updater
  # Namespaces of the cluster pull secret and of the CatalogSources. They are
  # parameters because `oc process` drops a hard-coded metadata.namespace
  # from template objects (it keeps only parameterised ones), which would
  # create these Roles in the current project instead.
  - name: PULL_SECRET_NAMESPACE
    value: kube-system
  - name: MARKETPLACE_NAMESPACE
    value: openshift-marketplace
  # Namespaces of OpenShift's ingress (where the inference gateway runs)
  # and of its operator (the default IngressController), for the Models
  # feature's Roles. Fixed: the code uses these names (pkg/cluster
  # inference_gateway.go), so do not change them. They are parameters only
  # because oc process drops a literal namespace from a Template's objects.
  - name: INGRESS_NAMESPACE
    value: openshift-ingress
  - name: INGRESS_OPERATOR_NAMESPACE
    value: openshift-ingress-operator
  - name: OAUTH_PROXY_IMAGE
    # Match the tag to your cluster's OCP minor version (e.g., v4.17 for OCP 4.17.x).
    # Find available tags: oc image info registry.redhat.io/openshift4/ose-oauth-proxy-rhel9 --filter-by-os=linux/amd64
    value: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.17
  # The image repository (no tag) the app reads release tags from to show
  # "vX.Y.Z is available"; empty turns the check off. install.sh passes the
  # repository it installs from.
  - name: IMAGE_REPOSITORY
    value: quay.io/juntao_wang/rhoai-nightly-updater
  # Release notes are linked as <RELEASES_URL>/<tag>.
  - name: RELEASES_URL
    value: https://gitlab.com/redhat/ai/rhoai-dashboard-team/rhoai-nightly-updater/-/releases
  # How the updater is installed, for the wording of its upgrade notices:
  # empty for install.sh and make, "gitops" when Argo CD renders the Helm
  # chart (deploy/chart sets it), so the notices say to change Git instead
  # of running install.sh.
  - name: INSTALL_METHOD
    value: ""
  # What the updater may do (docs/GITOPS.md, "Profiles"): empty or "full"
  # for every feature; "gitops" where Argo CD manages RHOAI: only Update's
  # Argo CD path and the Status, Components and Diagnostics reads (for
  # cluster-admins). The gitops profile's reduced RBAC is
  # deploy/rbac-gitops.yaml, which the Helm chart renders instead of this
  # Template's RBAC; with this Template the RBAC stays the full one. Any
  # other value stops the updater at startup.
  - name: PROFILE
    value: ""
  # The gitops profile only: the comma-separated names of the environment
  # variables a Subscription's spec.config may set (its admission policy
  # and Update check the same list; docs/GITOPS.md, section 11). The Helm
  # chart sets it from gitops.subscriptionEnvAllowlist.
  - name: SUBSCRIPTION_ENV_ALLOWLIST
    value: DISABLE_DSC_CONFIG
objects:

  # The app's own identity: the reads every signed-in user sees and the
  # app's own records. It is not the OAuth client users sign in with (that
  # is OAuthClient ${APP_NAME}-${NAMESPACE}, see the oauth-proxy container),
  # and every change to the cluster is made with the signed-in user's own
  # token (SECURITY.md, "Which token is used where").
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}

  # RBAC of the app's ServiceAccount. Every change to the cluster is made
  # with the signed-in user's own token (oauth-proxy's --scope=user:full
  # session; pkg/api withMutationAuth), so the API server checks it against
  # that user's RBAC and its audit log names them. This ServiceAccount only:
  #   - reads, for the pages every signed-in user sees (Status, Components,
  #     Diagnostics, the Environment page, Dashboard Dev, Build Explorer);
  #   - keeps the app's own records (Role ${APP_NAME} below);
  #   - runs the background MaaS prune job, which only takes away: it
  #     patches or deletes the tool's own named MaaS objects and the MaaS
  #     gateway, and never creates anything.
  # pkg/cluster/rbac_coverage_test.go and rbac_sa_split_test.go derive these
  # requests from the code's entry points (reads, background, records) and
  # fail when a rule is missing or unused, or when a change could reach this
  # token. Writes are only by name, or the app's own ConfigMaps
  # (TestServiceAccountWritesAreNamedOrItsOwnRecords). SECURITY.md audits
  # every rule. Cluster-scoped names carry the namespace so two installs do
  # not collide.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      # Cluster information and capacity diagnostics
      - apiGroups: ["config.openshift.io"]
        resources: ["clusterversions"]
        resourceNames: ["version"]
        verbs: ["get"]
      - apiGroups: ["config.openshift.io"]
        resources: ["consoles"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # The control plane topology (status.controlPlaneTopology): a
      # self-managed cluster's nodes do not use additional-pull-secret, so
      # the setup shows the command for openshift-config/pull-secret
      # (read-only, non-secret cluster config; SECURITY.md)
      - apiGroups: ["config.openshift.io"]
        resources: ["infrastructures"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # Mirrors: whether a mirror serves an image (IDMS and ITMS)
      - apiGroups: ["config.openshift.io"]
        resources: ["imagedigestmirrorsets", "imagetagmirrorsets"]
        verbs: ["list"]
      # Mirrors: an ImageContentSourcePolicy mirrors registry.redhat.io/rhoai
      # as well as an IDMS does (the MCO merges both); read-only,
      # non-secret cluster config (SECURITY.md)
      - apiGroups: ["operator.openshift.io"]
        resources: ["imagecontentsourcepolicies"]
        verbs: ["list"]
      # The apps domain, for the inference gateway's hostname
      - apiGroups: ["config.openshift.io"]
        resources: ["ingresses"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["list"]
      # Diagnostics: pod events (the FailedMount cause of a stuck pod) in the
      # RHOAI namespaces and the module namespaces
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list"]
      # Data science projects, and which namespaces exist
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list"]
      # Secrets: no list and no general read. Only by name, for the status
      # and the ownership checks of the Environment page: the S3 storage's
      # keys (and those of the storage earlier versions left in namespace
      # minio), the pipeline-server S3 Connection the tool creates, and the
      # MaaS database connection.
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["seaweedfs-s3-credentials", "minio-secret", "rhoai-nightly-updater-s3", "maas-db-config"]
        verbs: ["get"]
      # Upgrade gates the operator waits on (redhat-ods-operator), and
      # KServe's default gateway (ConfigMap inferenceservice-config in the
      # applications namespace, found at run time)
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["odh-upgrade-acks", "inferenceservice-config"]
        verbs: ["get"]
      # Webhook and CRD-conversion backing Services and their endpoints
      # (stale-webhook check), the S3 storage's Service, a model's KServe
      # Service
      - apiGroups: [""]
        resources: ["services"]
        verbs: ["get"]
      - apiGroups: ["discovery.k8s.io"]
        resources: ["endpointslices"]
        verbs: ["list"]
      # The data a teardown would delete (storage and MLflow namespaces)
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        verbs: ["list"]
      # Status, debug info and diagnostics (pods in the RHOAI, module,
      # marketplace and storage namespaces)
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list"]
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list"]
      - apiGroups: ["apps"]
        resources: ["replicasets"]
        verbs: ["list"]
      # The dashboard and MLflow addresses, the S3 storage's admin UI, and
      # the earlier storage's routes
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        resourceNames: ["rhods-dashboard", "mlflow", "seaweedfs-admin", "minio-api", "minio-ui"]
        verbs: ["get"]
      # The S3 storage's ingress policies (theirs and the earlier storage's)
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        resourceNames: ["seaweedfs-ingress", "minio-ingress"]
        verbs: ["get"]
      # The RHOAI operator and the operators features need (read-only)
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        resourceNames: ["rhods-operator", "kuadrant-operator", "rhcl-operator", "cloudnative-pg"]
        verbs: ["get"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions", "operatorgroups", "installplans"]
        verbs: ["list"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["clusterserviceversions"]
        verbs: ["get", "list"]
      # Stale webhooks (diagnostics)
      - apiGroups: ["admissionregistration.k8s.io"]
        resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
        verbs: ["list"]
      # DSC schema check and the CRD conversion scans (diagnostics)
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        resourceNames: ["datascienceclusters.datasciencecluster.opendatahub.io"]
        verbs: ["get"]
      - apiGroups: ["datasciencecluster.opendatahub.io"]
        resources: ["datascienceclusters"]
        verbs: ["get", "list"]
      - apiGroups: ["dscinitialization.opendatahub.io"]
        resources: ["dscinitializations"]
        verbs: ["list"]
      # Platform CR: upgrade gates (AdminAckRequired) and module readiness
      - apiGroups: ["config.opendatahub.io"]
        resources: ["platforms"]
        verbs: ["list"]
      # Module CRs, whose kinds the code discovers (they change with the
      # operator version): stuck-deletion and webhook-owner checks. RHOAI
      # 3.6 serves the databaseservice module's CR in the services group
      # (rhods-operator pkg/cluster/gvk/gvk.go); list only, no Secrets
      - apiGroups: ["components.platform.opendatahub.io", "services.platform.opendatahub.io"]
        resources: ["*"]
        verbs: ["list"]
      # Which Deployment cleans up a module CR: the one whose ServiceAccount
      # a ClusterRoleBinding lets update the CR's finalizers (module kinds
      # change between releases, and nothing on the Deployment names its
      # module). RBAC objects hold no secrets; read only (SECURITY.md).
      # ClusterRoleBinding argocd-manager-role-binding (by field selector)
      # also tells whether an Argo CD on another cluster may manage this one
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["clusterroles", "clusterrolebindings"]
        verbs: ["list"]
      # RoleBinding argocd-manager-role-binding, which `argocd cluster add
      # --namespace` makes in each namespace it lets another cluster's Argo
      # CD manage: read by that one name only, in RHOAI's and the catalog's
      # namespaces (SECURITY.md, "Reading Argo CD Applications")
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["rolebindings"]
        resourceNames: ["argocd-manager-role-binding"]
        verbs: ["get"]
      # Argo CD Applications, all of them, to find the one whose
      # status.resources lists the catalog, the Subscription or the DSC (the
      # tracking annotation or label only names it). Applications hold no
      # credentials; read only (SECURITY.md, "Reading Argo CD Applications")
      - apiGroups: ["argoproj.io"]
        resources: ["applications"]
        verbs: ["list"]
      - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
        resources: ["datasciencepipelinesapplications"]
        verbs: ["list"]
      - apiGroups: ["mlflow.opendatahub.io"]
        resources: ["mlflows"]
        resourceNames: ["mlflow"]
        verbs: ["get"]
      # Diagnostics, prerequisite operators: whether an installed operator's
      # singleton operand (<Kind>/cluster) exists. The kind comes from the
      # operator's CSV, so the resource is "*"; only "cluster", only read.
      - apiGroups: ["operator.openshift.io"]
        resources: ["*"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # Diagnostics: RHOAI Certificates cert-manager has not issued
      # (Certificates hold no key material)
      - apiGroups: ["cert-manager.io"]
        resources: ["certificates"]
        verbs: ["list"]
      # Models and MaaS: the gateway classes and Gateways (read-only)
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gatewayclasses"]
        resourceNames: ["openshift-ai-inference", "openshift-default"]
        verbs: ["get"]
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        verbs: ["list"]
      # The tool's catalog models, every model (the models that use the
      # gateway; the InferenceServices that use a component, for
      # Diagnostics and the hard reset), and the CPU preset. The
      # Environment page's per-project reads (5.0.0: the Playground and
      # samples status, a user's project) use the signed-in user's token.
      - apiGroups: ["serving.kserve.io"]
        resources: ["llminferenceservices"]
        verbs: ["get", "list"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["inferenceservices"]
        verbs: ["list"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["llminferenceserviceconfigs"]
        verbs: ["get"]
      # The OGX servers that use a component (Diagnostics, the hard reset),
      # and the playground server (its UID marks the one the tool
      # requested). Since 5.0.0 the Playground status reads the latter
      # with the signed-in user's token too; the grant stays because the
      # read goes through the shared getServed, which the RBAC coverage
      # test cannot tell apart by token.
      - apiGroups: ["ogx.io"]
        resources: ["ogxservers"]
        verbs: ["list"]
      - apiGroups: ["ogx.io"]
        resources: ["ogxservers"]
        resourceNames: ["lsd-genai-playground"]
        verbs: ["get"]
      # MaaS status: the database, Connectivity Link, the tenant, the
      # HTTPRoutes of the tool's chat models, and who else uses MaaS
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["clusters"]
        resourceNames: ["maas-db"]
        verbs: ["get"]
      - apiGroups: ["kuadrant.io"]
        resources: ["kuadrants"]
        verbs: ["list"]
      - apiGroups: ["operator.authorino.kuadrant.io"]
        resources: ["authorinos"]
        resourceNames: ["authorino"]
        verbs: ["get"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["aitenants"]
        resourceNames: ["models-as-a-service"]
        verbs: ["get"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maastenantconfigs"]
        resourceNames: ["default-tenant"]
        verbs: ["get"]
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        resourceNames: ["smollm2-135m-instruct-kserve-route", "qwen25-05b-instruct-kserve-route", "qwen3-1-7b-kserve-route"]
        verbs: ["get"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasmodelrefs", "maassubscriptions", "maasauthpolicies"]
        verbs: ["list"]
      # MaaS groups check (cluster-admins only): whether a group exists
      - apiGroups: ["user.openshift.io"]
        resources: ["groups"]
        verbs: ["get"]
      # The background MaaS prune job (pkg/api StartMaaSPruneJob): drops
      # the publications whose project or model is gone, so a project made
      # again with the same name cannot attach routes to the MaaS gateway.
      # It deletes the tool's MaaSModelRefs in projects that still exist
      # (by UID), and updates or deletes the tool's MaaSSubscription and
      # MaaSAuthPolicy; only these names, never create (SECURITY.md, "The
      # MaaS prune job").
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasmodelrefs"]
        resourceNames: ["smollm2-135m-instruct", "qwen25-05b-instruct", "qwen3-1-7b"]
        verbs: ["get", "delete"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maassubscriptions"]
        resourceNames: ["rhoai-nightly-updater-subscription"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasauthpolicies"]
        resourceNames: ["rhoai-nightly-updater-access"]
        verbs: ["get", "patch", "delete"]

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # The app's own state: activity log, deployment snapshot, running
  # operation (lease and marker). Its only unnamed write: create, which
  # cannot be limited by name, in its own namespace.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["create"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["rhoai-nightly-updater-activity", "rhoai-nightly-updater-snapshot", "rhoai-nightly-updater-operation"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["rhoai-nightly-updater-activity"]
        verbs: ["update"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["rhoai-nightly-updater-snapshot", "rhoai-nightly-updater-operation"]
        verbs: ["patch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # The cluster pull secret for quay.io/rhoai (kube-system): read for the
  # status and the Quay lookups; the setup writes it with the user's token
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${PULL_SECRET_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["additional-pull-secret"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${PULL_SECRET_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # The nightly CatalogSource and package lookups (openshift-marketplace),
  # read-only
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${MARKETPLACE_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: ["operators.coreos.com"]
        resources: ["catalogsources"]
        verbs: ["get"]
      - apiGroups: ["packages.operators.coreos.com"]
        resources: ["packagemanifests"]
        verbs: ["list"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${MARKETPLACE_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # OpenShift's ingress namespace: the inference and MaaS gateways and their
  # options ConfigMaps, their DNS records and the AuthPolicies on them
  # (read); and the prune job's one change: the MaaS gateway, and its
  # options ConfigMap when there is one, admit routes only from the projects
  # still published (patch by name, never create or delete).
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        resourceNames: ["openshift-ai-inference"]
        verbs: ["get"]
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        resourceNames: ["maas-default-gateway"]
        verbs: ["get", "patch"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["openshift-ai-inference-options"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["maas-gateway-options"]
        verbs: ["get", "patch"]
      - apiGroups: ["ingress.operator.openshift.io"]
        resources: ["dnsrecords"]
        verbs: ["list"]
      - apiGroups: ["kuadrant.io"]
        resources: ["authpolicies"]
        resourceNames: ["openshift-ai-inference-authn"]
        verbs: ["get"]
      - apiGroups: ["kuadrant.io"]
        resources: ["authpolicies", "tokenratelimitpolicies", "ratelimitpolicies"]
        verbs: ["list"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # Models: the default IngressController names the certificate the
  # gateway's external listener uses (read-only; the Secret is never read)
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_OPERATOR_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: ["operator.openshift.io"]
        resources: ["ingresscontrollers"]
        resourceNames: ["default"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_OPERATOR_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ${APP_NAME}
    spec:
      replicas: 1
      # Old ReplicaSets keep their pod template, including the COOKIE_SECRET
      # env of installs from before the cookie Secret, readable with
      # namespace view. Keep few; `make rollback` does not need them.
      revisionHistoryLimit: 2
      # Recreate keeps a single updater pod: operation locks are in-process,
      # so an old and a new pod must never run cluster changes concurrently.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            app.kubernetes.io/name: ${APP_NAME}
        spec:
          serviceAccountName: ${APP_NAME}
          automountServiceAccountToken: true
          # On shutdown the server waits for running cluster operations (their
          # 15-minute deadline, automatic recovery and bookkeeping), then up to
          # 20 seconds for connections and 10 for the operation marker.
          # pkg/cluster/budget_test.go checks that the total stays below this
          # value with a margin, so operations are not killed mid-way.
          terminationGracePeriodSeconds: 1020
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: ${APP_NAME}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: app
              image: ${IMAGE}
              env:
                # The API listens on localhost only: oauth-proxy (same pod)
                # is its only client. Probes and /metrics use METRICS_PORT.
                - name: BIND_ADDRESS
                  value: 127.0.0.1
                - name: METRICS_PORT
                  value: "9090"
                # Must match api.ExpectedTemplateRevision; bump both when a
                # template change matters to the running code.
                - name: TEMPLATE_REVISION
                  value: "8"
                # The update check (GET /api/update-check).
                - name: IMAGE_REPOSITORY
                  value: ${IMAGE_REPOSITORY}
                - name: RELEASES_URL
                  value: ${RELEASES_URL}
                - name: INSTALL_METHOD
                  value: ${INSTALL_METHOD}
                - name: PROFILE
                  value: ${PROFILE}
                # The gitops profile only: Update runs while this
                # ValidatingAdmissionPolicy and its binding (both named so
                # by deploy/rbac-gitops.yaml) are in place, and checks the
                # Subscription against the same allowlist.
                - name: GITOPS_ADMISSION_POLICY
                  value: ${APP_NAME}-${NAMESPACE}-gitops
                - name: SUBSCRIPTION_ENV_ALLOWLIST
                  value: ${SUBSCRIPTION_ENV_ALLOWLIST}
              ports:
                - containerPort: 9090
                  name: metrics
              startupProbe:
                httpGet:
                  path: /api/health
                  port: 9090
                failureThreshold: 10
                periodSeconds: 3
              readinessProbe:
                httpGet:
                  path: /api/health/ready
                  port: 9090
                initialDelaySeconds: 2
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 9090
                initialDelaySeconds: 5
                periodSeconds: 30
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

            - name: oauth-proxy
              image: ${OAUTH_PROXY_IMAGE}
              args:
                - --https-address=:8443
                - --provider=openshift
                # Users sign in through the cluster-scoped OAuthClient
                # ${APP_NAME}-${NAMESPACE} (install.sh, or the chart's
                # hook, creates it after the Route has its host:
                # grantMethod auto, redirect URI
                # https://<Route host>/oauth/callback, the secret below).
                # A ServiceAccount as the OAuth client cannot get user:full
                # (the OAuth server allows it only user:info,
                # user:check-access, the list-projects scopes and roles in
                # its own namespace), and the app makes every change with
                # the user's own token. The Helm chart's gitops profile,
                # which makes no change with the user's token, replaces
                # these three arguments and the oauth-client volume with
                # the ServiceAccount sign-in of 3.x (deploy/chart
                # _helpers.tpl, rnu.gitopsSignIn); keep them as they are.
                - --client-id=${APP_NAME}-${NAMESPACE}
                # Read raw, without trimming: the Secret's value has no
                # trailing newline.
                - --client-secret-file=/etc/proxy/oauth/client-secret
                - --scope=user:full
                - --upstream=http://127.0.0.1:8080
                - --upstream-timeout=960s
                - --upstream-flush=200ms
                - --tls-cert=/etc/tls/private/tls.crt
                - --tls-key=/etc/tls/private/tls.key
                # Kept in a Secret that re-applies do not change.
                - --cookie-secret-file=/etc/proxy/secrets/session_secret
                # Below the OAuth access token lifetime (OAuth
                # accessTokenMaxAgeSeconds, 86400s by default), so the session
                # ends before the token it carries stops working. The cookie
                # carries the user's full token, encrypted with the session
                # secret (SECURITY.md, "Threat model"). No --cookie-refresh:
                # openshift/oauth-proxy validates a refresh with the token in
                # a query parameter, which the API server ignores, so it
                # signs users out (and can log the token on a network error).
                - --cookie-expire=23h
                # Lax, as RHOAI's own gateway proxy (opendatahub-operator
                # kube-auth-proxy-oauth-deployment.tmpl.yaml). The callback
                # needs the CSRF cookie oauth-proxy set at the start, and it
                # gets SameSite from this flag too (oauthproxy.go makeCookie).
                # With Strict, a sign-in through an identity provider on
                # another site (Red Hat SSO, OIDC) ended in "403 named cookie
                # not present": the browser withheld the cookie on the
                # redirect chain from that site. Cross-site requests still
                # cannot change anything: changes need a JSON POST, which a
                # browser sends cross-site only after a CORS preflight the
                # app never grants, and no GET changes state.
                - --cookie-samesite=lax
                # The app trusts only the token of this proxy's own OAuth
                # session (X-Forwarded-Access-Token) and refuses bearer
                # tokens. Do not add --openshift-delegate-urls or
                # --pass-user-bearer-token, which accept client tokens.
                - --pass-access-token=true
                - --pass-user-headers=true
                # The sign-in gate (5.0.0): whoever RHOAI lets in, that is
                # who may get auths.services.platform.opendatahub.io (the
                # cluster-scoped Auth CR). RHOAI binds exactly that, as
                # ClusterRole data-science-allowedgroupcluster-role, to its
                # Auth CR's allowedGroups (system:authenticated by default):
                # rhods-operator rhoai-3.6 (452b4a5)
                # internal/controller/services/auth/resources/data-science-allowedgroup-clusterrole.tmpl.yaml:1-19,
                # auth_controller_actions.go:201. Cluster-admins always
                # pass; without RHOAI only they do. What each user then
                # sees is the app's own read tiers (pkg/api route_tiers.go).
                # oauth-proxy (openshift/oauth-proxy release-4.17 a578b1d,
                # providers/openshift/provider.go:202-207,234-258,336,489-526)
                # posts this JSON, plus "scopes": [], as an
                # authorization.openshift.io/v1 SubjectAccessReview with
                # the user's token and refuses the sign-in unless it is
                # allowed. Its fields are the OpenShift Action's
                # (openshift/api release-4.17 authorization/v1/types.go:351-373):
                # the API group is "resourceAPIGroup" (an unknown key such
                # as "group" would be dropped, asking for core "auths"),
                # and no namespace is a cluster-wide check.
                - --openshift-sar={"verb":"get","resourceAPIGroup":"services.platform.opendatahub.io","resource":"auths"}
              ports:
                - containerPort: 8443
                  name: https
              # oauth-proxy answers /oauth/healthz before authentication.
              readinessProbe:
                httpGet:
                  path: /oauth/healthz
                  port: 8443
                  scheme: HTTPS
                initialDelaySeconds: 3
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                httpGet:
                  path: /oauth/healthz
                  port: 8443
                  scheme: HTTPS
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 3
              volumeMounts:
                - name: tls
                  mountPath: /etc/tls/private
                  readOnly: true
                - name: proxy-secret
                  mountPath: /etc/proxy/secrets
                  readOnly: true
                - name: oauth-client
                  mountPath: /etc/proxy/oauth
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              # oauth-proxy writes no files: sessions are cookies, and it
              # parses only url-encoded forms (openshift/oauth-proxy
              # oauthproxy.go; manual sign-in, the one multipart reader, is
              # off without --htpasswd-file). No /tmp volume needed.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

          volumes:
            - name: tls
              secret:
                secretName: ${APP_NAME}-tls
            - name: proxy-secret
              secret:
                secretName: ${APP_NAME}-proxy
            # The OAuth client secret (key client-secret), created once by
            # install.sh or the chart's hook and kept on re-apply, like the
            # session secret. OAuthClient ${APP_NAME}-${NAMESPACE} holds the
            # same value.
            - name: oauth-client
              secret:
                secretName: ${APP_NAME}-oauth-client

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: ${APP_NAME}-tls
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}
      ports:
        - name: https
          port: 8443
          targetPort: 8443
        # Serves only /metrics and the health probes, never the API.
        - name: metrics
          port: 9090
          targetPort: 9090
          protocol: TCP

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      podSelector:
        matchLabels:
          app: ${APP_NAME}
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
          ports:
            - port: 8443
              protocol: TCP
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-monitoring
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-user-workload-monitoring
          ports:
            - port: 9090
              protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        haproxy.router.openshift.io/timeout: 960s
    spec:
      to:
        kind: Service
        name: ${APP_NAME}
      port:
        targetPort: https
      tls:
        termination: reencrypt

  # Metrics and alerts take effect only when user workload monitoring is
  # enabled on the cluster (it is off by default; see the OpenShift docs
  # "Enabling monitoring for user-defined projects"). Without it these two
  # objects are inert.
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}
      endpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      groups:
        - name: ${APP_NAME}.rules
          rules:
            - alert: NightlyUpdaterDown
              # absent() also fires when the target is gone entirely.
              expr: up{job="${APP_NAME}", namespace="${NAMESPACE}"} == 0 or absent(up{job="${APP_NAME}", namespace="${NAMESPACE}"})
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: RHOAI Nightly Updater is down
                description: "The ${APP_NAME} target has been unreachable for 5 minutes."

            - alert: NightlyUpdateFailed
              expr: increase(rhoai_nightly_updater_updates_failed_total[1h]) > 0
              labels:
                severity: warning
              annotations:
                summary: A nightly update has failed
                description: "At least one nightly update has failed in the last hour."

            - alert: NightlyUpdaterHighErrorRate
              expr: >-
                (
                  increase(rhoai_nightly_updater_updates_failed_total[10m])
                  /
                  clamp_min(increase(rhoai_nightly_updater_updates_total[10m]), 1)
                ) > 0.5
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: RHOAI Nightly Updater has a high error rate
                description: "More than 50% of updates have failed over the last 10 minutes."

            - alert: NightlyUpdaterPodRestarting
              expr: increase(kube_pod_container_status_restarts_total{namespace="${NAMESPACE}", container="app"}[1h]) > 3
              labels:
                severity: warning
              annotations:
                summary: RHOAI Nightly Updater pod is restarting frequently
                description: "The nightly updater container has restarted more than 3 times in the last hour."
