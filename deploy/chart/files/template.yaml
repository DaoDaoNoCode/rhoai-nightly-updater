  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${MARKETPLACE_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # Models: the inference gateway in OpenShift's ingress namespace (the
  # Gateway and its options ConfigMap, only by their names but create; MaaS:
  # Gateway maas-default-gateway),
  # its DNS records (read-only, whether the hostname is published) and the
  # AuthPolicy odh-model-controller adds to it (read-only)
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        verbs: ["create"]
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        resourceNames: ["openshift-ai-inference", "maas-default-gateway"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["create"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["openshift-ai-inference-options", "maas-gateway-options"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["ingress.operator.openshift.io"]
        resources: ["dnsrecords"]
        verbs: ["list"]
      - apiGroups: ["kuadrant.io"]
        resources: ["authpolicies"]
        resourceNames: ["openshift-ai-inference-authn"]
        verbs: ["get"]
      # MaaS: the AuthPolicy maas-controller puts on the MaaS gateway, found
      # by its target because its name differs between releases (read-only)
      - apiGroups: ["kuadrant.io"]
        resources: ["authpolicies"]
        verbs: ["list"]
      # MaaS: the gateway policies a tier-based MaaS left on the MaaS
      # gateway (read-only), and only the two the MaaS upgrade guide names
      # (migration/upgrade-to-3.4.md Phase 4) may be deleted
      - apiGroups: ["kuadrant.io"]
        resources: ["tokenratelimitpolicies", "ratelimitpolicies"]
        verbs: ["list"]
      - apiGroups: ["kuadrant.io"]
        resources: ["authpolicies"]
        resourceNames: ["gateway-auth-policy"]
        verbs: ["delete"]
      - apiGroups: ["kuadrant.io"]
        resources: ["tokenratelimitpolicies"]
        resourceNames: ["gateway-tier-rate-limits"]
        verbs: ["delete"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  # Models: the default IngressController names the certificate the
  # gateway's external listener uses (read-only; the Secret is never read)
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_OPERATOR_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      - apiGroups: ["operator.openshift.io"]
        resources: ["ingresscontrollers"]
        resourceNames: ["default"]
        verbs: ["get"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      namespace: ${INGRESS_OPERATOR_NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: ${APP_NAME}-${NAMESPACE}
    subjects:
      - kind: ServiceAccount
        name: ${APP_NAME}
        namespace: ${NAMESPACE}

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ${APP_NAME}
    spec:
      replicas: 1
      # Old ReplicaSets keep their pod template, including the COOKIE_SECRET
      # env of installs from before the cookie Secret, readable with
      # namespace view. Keep few; `make rollback` does not need them.
      revisionHistoryLimit: 2
      # Recreate keeps a single updater pod: operation locks are in-process,
      # so an old and a new pod must never run cluster changes concurrently.
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: ${APP_NAME}
      template:
        metadata:
          labels:
            app: ${APP_NAME}
            app.kubernetes.io/name: ${APP_NAME}
        spec:
          serviceAccountName: ${APP_NAME}
          automountServiceAccountToken: true
          # On shutdown the server waits for running cluster operations (their
          # 15-minute deadline, automatic recovery and bookkeeping), then up to
          # 20 seconds for connections and 10 for the operation marker.
          # pkg/cluster/budget_test.go checks that the total stays below this
          # value with a margin, so operations are not killed mid-way.
          terminationGracePeriodSeconds: 1020
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: ${APP_NAME}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: app
              image: ${IMAGE}
              env:
                # The API listens on localhost only: oauth-proxy (same pod)
                # is its only client. Probes and /metrics use METRICS_PORT.
                - name: BIND_ADDRESS
                  value: 127.0.0.1
                - name: METRICS_PORT
                  value: "9090"
                # Must match api.ExpectedTemplateRevision; bump both when a
                # template change matters to the running code.
                - name: TEMPLATE_REVISION
                  value: "6"
                # The update check (GET /api/update-check).
                - name: IMAGE_REPOSITORY
                  value: ${IMAGE_REPOSITORY}
                - name: RELEASES_URL
                  value: ${RELEASES_URL}
                - name: INSTALL_METHOD
                  value: ${INSTALL_METHOD}
                - name: PROFILE
                  value: ${PROFILE}
                # The gitops profile only: Update runs while this
                # ValidatingAdmissionPolicy and its binding (both named so
                # by deploy/rbac-gitops.yaml) are in place, and checks the
                # Subscription against the same allowlist.
                - name: GITOPS_ADMISSION_POLICY
                  value: ${APP_NAME}-${NAMESPACE}-gitops
                - name: SUBSCRIPTION_ENV_ALLOWLIST
                  value: ${SUBSCRIPTION_ENV_ALLOWLIST}
              ports:
                - containerPort: 9090
                  name: metrics
              startupProbe:
                httpGet:
                  path: /api/health
                  port: 9090
                failureThreshold: 10
                periodSeconds: 3
              readinessProbe:
                httpGet:
                  path: /api/health/ready
                  port: 9090
                initialDelaySeconds: 2
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 9090
                initialDelaySeconds: 5
                periodSeconds: 30
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

            - name: oauth-proxy
              image: ${OAUTH_PROXY_IMAGE}
              args:
                - --https-address=:8443
                - --provider=openshift
                - --openshift-service-account=${APP_NAME}
                - --upstream=http://127.0.0.1:8080
                - --upstream-timeout=960s
                - --upstream-flush=200ms
                - --tls-cert=/etc/tls/private/tls.crt
                - --tls-key=/etc/tls/private/tls.key
                # Kept in a Secret that re-applies do not change.
                - --cookie-secret-file=/etc/proxy/secrets/session_secret
                # Below the OAuth access token lifetime (OAuth
                # accessTokenMaxAgeSeconds, 86400s by default), so the session
                # ends before the token it carries stops working.
                - --cookie-expire=23h
                - --cookie-samesite=strict
                # The app trusts only the token of this proxy's own OAuth
                # session (X-Forwarded-Access-Token) and refuses bearer
                # tokens. Do not add --openshift-delegate-urls or
                # --pass-user-bearer-token, which accept client tokens.
                - --pass-access-token=true
                - --pass-user-headers=true
                - --openshift-sar={"resource":"pods","verb":"list","namespace":"redhat-ods-operator"}
              ports:
                - containerPort: 8443
                  name: https
              # oauth-proxy answers /oauth/healthz before authentication.
              readinessProbe:
                httpGet:
                  path: /oauth/healthz
                  port: 8443
                  scheme: HTTPS
                initialDelaySeconds: 3
                periodSeconds: 10
                timeoutSeconds: 3
              livenessProbe:
                httpGet:
                  path: /oauth/healthz
                  port: 8443
                  scheme: HTTPS
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 3
              volumeMounts:
                - name: tls
                  mountPath: /etc/tls/private
                  readOnly: true
                - name: proxy-secret
                  mountPath: /etc/proxy/secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

          volumes:
            - name: tls
              secret:
                secretName: ${APP_NAME}-tls
            - name: proxy-secret
              secret:
                secretName: ${APP_NAME}-proxy

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: ${APP_NAME}-tls
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      selector:
        app: ${APP_NAME}
      ports:
        - name: https
          port: 8443
          targetPort: 8443
        # Serves only /metrics and the health probes, never the API.
        - name: metrics
          port: 9090
          targetPort: 9090
          protocol: TCP

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
    spec:
      podSelector:
        matchLabels:
          app: ${APP_NAME}
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
          ports:
            - port: 8443
              protocol: TCP
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-monitoring
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-user-workload-monitoring
          ports:
            - port: 9090
              protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        haproxy.router.openshift.io/timeout: 960s
    spec:
      to:
        kind: Service
        name: ${APP_NAME}
      port:
        targetPort: https
      tls:
        termination: reencrypt

  # Metrics and alerts take effect only when user workload monitoring is
  # enabled on the cluster (it is off by default; see the OpenShift docs
  # "Enabling monitoring for user-defined projects"). Without it these two
  # objects are inert.
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: ${APP_NAME}
      endpoints:
        - port: metrics
          path: /metrics
          interval: 60s

  - apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: ${APP_NAME}
    spec:
      groups:
        - name: ${APP_NAME}.rules
          rules:
            - alert: NightlyUpdaterDown
              # absent() also fires when the target is gone entirely.
              expr: up{job="${APP_NAME}", namespace="${NAMESPACE}"} == 0 or absent(up{job="${APP_NAME}", namespace="${NAMESPACE}"})
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: RHOAI Nightly Updater is down
                description: "The ${APP_NAME} target has been unreachable for 5 minutes."

            - alert: NightlyUpdateFailed
              expr: increase(rhoai_nightly_updater_updates_failed_total[1h]) > 0
              labels:
                severity: warning
              annotations:
                summary: A nightly update has failed
                description: "At least one nightly update has failed in the last hour."

            - alert: NightlyUpdaterHighErrorRate
              expr: >-
                (
                  increase(rhoai_nightly_updater_updates_failed_total[10m])
                  /
                  clamp_min(increase(rhoai_nightly_updater_updates_total[10m]), 1)
                ) > 0.5
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: RHOAI Nightly Updater has a high error rate
                description: "More than 50% of updates have failed over the last 10 minutes."

            - alert: NightlyUpdaterPodRestarting
              expr: increase(kube_pod_container_status_restarts_total{namespace="${NAMESPACE}", container="app"}[1h]) > 3
              labels:
                severity: warning
              annotations:
                summary: RHOAI Nightly Updater pod is restarting frequently
                description: "The nightly updater container has restarted more than 3 times in the last hour."
