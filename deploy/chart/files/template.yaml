apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhoai-nightly-updater
  annotations:
    description: >-
      RHOAI Nightly Updater. Requires cluster-admin to apply. Before the first
      apply, create the oauth-proxy session secret once (it is kept across
      re-applies, so sessions survive upgrades):
      oc create secret generic <APP_NAME>-proxy -n <NAMESPACE>
      --from-literal=session_secret="$(head -c 64 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)".
      `make deploy` / `make upgrade` do this for you.
parameters:
  - name: IMAGE
    required: true
  - name: NAMESPACE
    value: rhoai-nightly-updater
  - name: APP_NAME
    value: rhoai-nightly-updater
  # Namespaces of the cluster pull secret and of the CatalogSources. They are
  # parameters because `oc process` drops a hard-coded metadata.namespace
  # from template objects (it keeps only parameterised ones), which would
  # create these Roles in the current project instead.
  - name: PULL_SECRET_NAMESPACE
    value: kube-system
  - name: MARKETPLACE_NAMESPACE
    value: openshift-marketplace
  # Namespaces of OpenShift's ingress (where the inference gateway runs)
  # and of its operator (the default IngressController), for the Models
  # feature's Roles. Fixed: the code uses these names (pkg/cluster
  # inference_gateway.go), so do not change them. They are parameters only
  # because oc process drops a literal namespace from a Template's objects.
  - name: INGRESS_NAMESPACE
    value: openshift-ingress
  - name: INGRESS_OPERATOR_NAMESPACE
    value: openshift-ingress-operator
  - name: OAUTH_PROXY_IMAGE
    # Match the tag to your cluster's OCP minor version (e.g., v4.17 for OCP 4.17.x).
    # Find available tags: oc image info registry.redhat.io/openshift4/ose-oauth-proxy-rhel9 --filter-by-os=linux/amd64
    value: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.17
  # The image repository (no tag) the app reads release tags from to show
  # "vX.Y.Z is available"; empty turns the check off. install.sh passes the
  # repository it installs from.
  - name: IMAGE_REPOSITORY
    value: quay.io/juntao_wang/rhoai-nightly-updater
  # Release notes are linked as <RELEASES_URL>/<tag>.
  - name: RELEASES_URL
    value: https://gitlab.com/redhat/ai/rhoai-dashboard-team/rhoai-nightly-updater/-/releases
  # How the updater is installed, for the wording of its upgrade notices:
  # empty for install.sh and make, "gitops" when Argo CD renders the Helm
  # chart (deploy/chart sets it), so the notices say to change Git instead
  # of running install.sh.
  - name: INSTALL_METHOD
    value: ""
  # What the updater may do (docs/GITOPS.md, "Profiles"): empty or "full"
  # for every feature; "gitops" where Argo CD manages RHOAI: only Update's
  # Argo CD path and the Status, Components and Diagnostics reads (for
  # cluster-admins). The gitops profile's reduced RBAC is
  # deploy/rbac-gitops.yaml, which the Helm chart renders instead of this
  # Template's RBAC; with this Template the RBAC stays the full one. Any
  # other value stops the updater at startup.
  - name: PROFILE
    value: ""
  # The gitops profile only: the comma-separated names of the environment
  # variables a Subscription's spec.config may set (its admission policy
  # and Update check the same list; docs/GITOPS.md, section 11). The Helm
  # chart sets it from gitops.subscriptionEnvAllowlist.
  - name: SUBSCRIPTION_ENV_ALLOWLIST
    value: DISABLE_DSC_CONFIG
objects:

  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ${APP_NAME}
      namespace: ${NAMESPACE}
      annotations:
        serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"${APP_NAME}"}}'

  # RBAC: exactly the requests the backend makes with this ServiceAccount,
  # including the restore, revert and cleanup paths (webhook deletes, CRD
  # conversion patches, finalizer removal, dashboard-operator scaling,
  # Subscription/CatalogSource restore). pkg/cluster/rbac_coverage_test.go
  # derives every API call from the code and fails when a rule is missing or
  # unused. Rules are namespaced Roles where the namespace always exists when
  # the template is applied; operator namespaces (redhat-ods-*, seaweedfs)
  # are created later by RHOAI or by this tool, so their rules are cluster-wide
  # but limited to fixed object names where the API allows it. "create"
  # cannot be limited by name
  # (https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources).
  # Cluster-scoped names carry the namespace so two installs do not collide.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: ${APP_NAME}-${NAMESPACE}
      labels:
        app.kubernetes.io/instance: ${APP_NAME}-${NAMESPACE}
    rules:
      # Cluster information and capacity diagnostics
      - apiGroups: ["config.openshift.io"]
        resources: ["clusterversions"]
        resourceNames: ["version"]
        verbs: ["get"]
      - apiGroups: ["config.openshift.io"]
        resources: ["consoles"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # The control plane topology (status.controlPlaneTopology): a
      # self-managed cluster's nodes do not use additional-pull-secret, so
      # the setup shows the command for openshift-config/pull-secret
      # (read-only, non-secret cluster config; SECURITY.md)
      - apiGroups: ["config.openshift.io"]
        resources: ["infrastructures"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      - apiGroups: ["config.openshift.io"]
        resources: ["imagedigestmirrorsets"]
        verbs: ["list"]
      - apiGroups: [""]
        resources: ["nodes"]
        verbs: ["list"]
      # Diagnostics: pod events (the FailedMount cause of a stuck pod) in the
      # RHOAI namespaces and the module namespaces labelled
      # platform.opendatahub.io/part-of
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["list"]
      # Namespaces: list DS projects; create redhat-ods-operator and
      # seaweedfs (never a pipeline project: it must be a DS project).
      # Only the two storage namespaces may be deleted, each only when the
      # user ticks it and only when it carries the tool label and the
      # tool's managers wrote it (UID precondition):
      # minio (the storage earlier versions set up) at the end of Migrate
      # storage, and seaweedfs at the end of the storage's Tear down.
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "create"]
      - apiGroups: [""]
        resources: ["namespaces"]
        resourceNames: ["redhat-ods-operator"]
        verbs: ["patch"]
      - apiGroups: [""]
        resources: ["namespaces"]
        resourceNames: ["minio", "seaweedfs"]
        verbs: ["delete"]
      # Secrets: no list and no general read. The S3 storage's keys, the
      # keys of the storage earlier versions left in namespace minio (read
      # for the migration, deleted with it), and the pipeline-server
      # connection secret in user projects.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["create"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["seaweedfs-s3-credentials"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["minio-secret"]
        verbs: ["get", "delete"]
      # The copy Job's Secret with the old storage's keys (Migrate storage,
      # namespace seaweedfs): an earlier run's is read and deleted before a
      # new one is created, and the Job is made its owner, which
      # OwnerReferencesPermissionEnforcement allows only with delete on it
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["seaweedfs-migrate-source"]
        verbs: ["get", "patch", "delete"]
      # The pipeline-server S3 secret; dashboard-dspa-secret is the name
      # older versions used, kept so their teardown still works. Setup and
      # Migrate storage make the DSPA its owner (no blockOwnerDeletion),
      # which OwnerReferencesPermissionEnforcement allows only with delete
      # on the Secret.
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["nightly-dspa-s3", "dashboard-dspa-secret"]
        verbs: ["get", "delete"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["nightly-dspa-s3"]
        verbs: ["patch"]
      # The dashboard S3 Connection set up with each pipeline server (the
      # same keys as nightly-dspa-s3), owned by the DSPA like it: written
      # by setup and Migrate storage, deleted by teardown
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["rhoai-nightly-updater-s3"]
        verbs: ["get", "patch", "delete"]
      # Upgrade gates the operator waits on (redhat-ods-operator)
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["odh-upgrade-acks"]
        verbs: ["get"]
      # Models: KServe's default gateway (ConfigMap inferenceservice-config,
      # key ingress) in the applications namespace, which is found at run
      # time, so cluster-wide but only this name; read-only
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["inferenceservice-config"]
        verbs: ["get"]
      # Webhook and CRD-conversion backing Services and their endpoints
      # (stale-webhook check), and the S3 storage's Service; minio-service
      # is the earlier storage's, only deleted
      - apiGroups: [""]
        resources: ["services"]
        verbs: ["get", "create"]
      - apiGroups: ["discovery.k8s.io"]
        resources: ["endpointslices"]
        verbs: ["list"]
      - apiGroups: [""]
        resources: ["services"]
        resourceNames: ["seaweedfs-s3"]
        verbs: ["patch", "delete"]
      - apiGroups: [""]
        resources: ["services"]
        resourceNames: ["minio-service"]
        verbs: ["delete"]
      # PVCs: the S3 storage's own, the data PVCs earlier versions left in
      # namespace minio (only deleted), and listing the storage and MLflow
      # namespaces to name the data a teardown deletes
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        verbs: ["list", "create"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        resourceNames: ["seaweedfs-data"]
        verbs: ["patch", "delete"]
      - apiGroups: [""]
        resources: ["persistentvolumeclaims"]
        resourceNames: ["seaweedfs-pvc", "minio-pvc"]
        verbs: ["delete"]
      # Pods in the RHOAI and module namespaces and openshift-marketplace:
      # status, debug info and diagnostics; in namespace seaweedfs, the S3
      # storage's pod (why it is not ready) and the Migrate storage copy
      # Job's pod (its result is the pod's termination message) (read-only)
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["list"]
      # Deployments: dashboard image overrides, dashboard-operator pause and
      # restore, operator restart, rollout assist, the S3 storage (SeaweedFS;
      # seaweedfs and minio are also the names earlier versions used in
      # namespace minio, deleted with that storage)
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "patch", "create"]
      - apiGroups: ["apps"]
        resources: ["deployments"]
        resourceNames: ["seaweedfs", "minio"]
        verbs: ["delete"]
      # ReplicaSets: rollout assist, and the controller of a pod's
      # ReplicaSet when its name is not <deployment>-<hash> (an adopted one;
      # listed by name with a field selector, no get)
      - apiGroups: ["apps"]
        resources: ["replicasets"]
        verbs: ["list"]
      # Routes: the dashboard and MLflow addresses, the S3 storage's admin UI,
      # and the earlier storage's (read for the pipeline-server dependency
      # check, deleted with it)
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        resourceNames: ["rhods-dashboard", "mlflow", "seaweedfs-admin", "minio-api", "minio-ui"]
        verbs: ["get"]
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        resourceNames: ["seaweedfs-admin"]
        verbs: ["patch", "delete"]
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        resourceNames: ["minio-api", "minio-ui"]
        verbs: ["delete"]
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        verbs: ["create"]
      # Migrate storage: the copy Job in namespace seaweedfs (create cannot
      # be limited by name), read and deleted only by its fixed name
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create"]
      - apiGroups: ["batch"]
        resources: ["jobs"]
        resourceNames: ["seaweedfs-migrate"]
        verbs: ["get", "delete"]
      # The S3 storage's ingress policy (S3 port from cluster pods, admin UI
      # from the router), created with SeaweedFS and removed by its teardown;
      # earlier versions used the same name in namespace minio, and
      # minio-ingress for MinIO's, removed with that storage
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        verbs: ["create"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        resourceNames: ["seaweedfs-ingress"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["networkpolicies"]
        resourceNames: ["minio-ingress"]
        verbs: ["get", "delete"]
      # The RHOAI operator (redhat-ods-operator namespace)
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        resourceNames: ["rhods-operator"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions", "operatorgroups"]
        verbs: ["create"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["operatorgroups"]
        verbs: ["list"]
      # Operators a feature needs (cert-manager, Connectivity Link,
      # CloudNativePG) are found by package in any namespace, as RHOAI's
      # KServe finds them, so a second install is never made elsewhere;
      # read-only. SECURITY.md, "One-click prerequisites".
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        verbs: ["list"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["operatorgroups"]
        resourceNames: ["rhods-operator"]
        verbs: ["patch"]
      - apiGroups: ["operators.coreos.com"]
        resources: ["clusterserviceversions"]
        verbs: ["get", "list", "delete"]
      # InstallPlans: follow the install, approve the one the tool caused
      # under Manual approval, delete Failed ones
      - apiGroups: ["operators.coreos.com"]
        resources: ["installplans"]
        verbs: ["get", "list", "patch", "delete"]
      # Stale webhooks are removed during reinstall and by diagnostics
      - apiGroups: ["admissionregistration.k8s.io"]
        resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
        verbs: ["list", "delete"]
      # DSC schema check, conversion-webhook removal while the operator is
      # down, and the CRD conversion scans (diagnostics, namespace guard)
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        resourceNames: ["datascienceclusters.datasciencecluster.opendatahub.io", "dscinitializations.dscinitialization.opendatahub.io"]
        verbs: ["get"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        resourceNames: ["datascienceclusters.datasciencecluster.opendatahub.io", "dscinitializations.dscinitialization.opendatahub.io"]
        verbs: ["patch"]
      - apiGroups: ["datasciencecluster.opendatahub.io"]
        resources: ["datascienceclusters"]
        verbs: ["get", "list", "patch", "create"]
      - apiGroups: ["dscinitialization.opendatahub.io"]
        resources: ["dscinitializations"]
        verbs: ["list"]
      # Platform CR: upgrade gates (AdminAckRequired) and module readiness
      - apiGroups: ["config.opendatahub.io"]
        resources: ["platforms"]
        verbs: ["list"]
      - apiGroups: ["config.opendatahub.io"]
        resources: ["platforms"]
        resourceNames: ["default"]
        verbs: ["get"]
      # Module CRs: stuck-deletion and webhook-owner checks, disable-component
      # preconditions, and finalizer removal for a CR whose operator is gone.
      # The group holds only RHOAI module CRs and its kinds change with the
      # operator version (3.6 added aihubs, aipipelines,
      # mcplifecycleoperators), so the code discovers them; a fixed list
      # would silently miss new kinds.
      - apiGroups: ["components.platform.opendatahub.io"]
        resources: ["*"]
        verbs: ["list", "patch"]
      # Pipeline servers: only the names the tool creates: dspa (the
      # dashboard's name, which workbench pipelines need; also the earliest
      # versions') and nightly-dspa (the earlier name: status, teardown,
      # Migrate storage and Recreate with the standard name)
      - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
        resources: ["datasciencepipelinesapplications"]
        verbs: ["list", "create"]
      - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
        resources: ["datasciencepipelinesapplications"]
        resourceNames: ["nightly-dspa", "dspa"]
        verbs: ["get", "delete"]
      # patch: Migrate storage moves a pipeline server an earlier version
      # created (proven by its label or field ownership) to the new storage;
      # setup re-applies its own dspa
      - apiGroups: ["datasciencepipelinesapplications.opendatahub.io"]
        resources: ["datasciencepipelinesapplications"]
        resourceNames: ["nightly-dspa", "dspa"]
        verbs: ["patch"]
      - apiGroups: ["mlflow.opendatahub.io"]
        resources: ["mlflows"]
        resourceNames: ["mlflow"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["mlflow.opendatahub.io"]
        resources: ["mlflows"]
        verbs: ["create"]
      # Samples (Environment page). Not Kubernetes objects: MLflow checks
      # mlflow.kubeflow.org with SelfSubjectAccessReviews of the app's token
      # in the sample's project. The sample pipeline is run by the user with
      # their own token: no pipeline server (KFP) API rule (SECURITY.md).
      # Everything but create is limited to the samples' own names; create
      # cannot be limited by name. No unnamed delete (SECURITY.md).
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["experiments", "datasets", "registeredmodels"]
        verbs: ["create"]
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["experiments"]
        resourceNames: ["MLflow Demo"]
        verbs: ["get", "update"]
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["experiments"]
        resourceNames: ["nightly-sample-training"]
        verbs: ["get", "update", "delete"]
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["registeredmodels"]
        resourceNames: ["nightly-sample-classifier"]
        verbs: ["get", "update", "delete"]
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["mcpservers"]
        resourceNames: ["com.deepwiki/rhoai-nightly-sample"]
        verbs: ["get", "update", "delete"]
      - apiGroups: ["mlflow.kubeflow.org"]
        resources: ["skills"]
        resourceNames: ["nightly-sample-mcp-builder"]
        verbs: ["get", "update", "delete"]
      # Diagnostics, prerequisite operators: whether an installed operator's
      # singleton operand (<Kind>/cluster, e.g. JobSetOperator/cluster) exists.
      # The kind comes from the operator's CSV, so the resource is "*";
      # only objects named "cluster" can be read, and only read.
      - apiGroups: ["operator.openshift.io"]
        resources: ["*"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # Diagnostics: RHOAI Certificates cert-manager has not issued
      # (Certificates hold no key material; the Secrets they produce are not
      # readable)
      - apiGroups: ["cert-manager.io"]
        resources: ["certificates"]
        verbs: ["list"]
      # Models (Environment page). The inference gateway's GatewayClass is
      # cluster-scoped: create (not limited by name), and only its own name
      # for the rest. The Gateway and its options ConfigMap are in the
      # ingress namespace's Role below.
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gatewayclasses"]
        verbs: ["create"]
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gatewayclasses"]
        resourceNames: ["openshift-ai-inference"]
        verbs: ["get", "patch", "delete"]
      # Teardown keeps that class while another Gateway uses it: Gateways
      # are listed cluster-wide (read-only; another can be in any namespace)
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        verbs: ["list"]
      # MaaS: read OpenShift's shared class openshift-default (created only
      # when missing, with the create rule above; never changed or deleted)
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gatewayclasses"]
        resourceNames: ["openshift-default"]
        verbs: ["get"]
      # The apps domain, for the gateway's hostname inference.<domain>
      - apiGroups: ["config.openshift.io"]
        resources: ["ingresses"]
        resourceNames: ["cluster"]
        verbs: ["get"]
      # Whether a mirror serves the CPU preset's image (with the existing
      # imagedigestmirrorsets list)
      - apiGroups: ["config.openshift.io"]
        resources: ["imagetagmirrorsets"]
        verbs: ["list"]
      # The model: an LLMInferenceService in the user's data science project
      # (create cannot be limited by name; the rest only the catalog's names),
      # all of them listed to find the models that use the gateway, and the
      # CPU preset, whose name is found at run time (read-only)
      - apiGroups: ["serving.kserve.io"]
        resources: ["llminferenceservices"]
        verbs: ["create"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["llminferenceservices"]
        resourceNames: ["smollm2-135m-instruct", "qwen25-05b-instruct", "qwen3-1-7b", "granite-embedding-125m-english"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["llminferenceserviceconfigs"]
        verbs: ["get"]
      # The project's ResourceQuotas, for the model setup's room check
      # (hard minus used). Read-only; quotas hold no secrets.
      - apiGroups: [""]
        resources: ["resourcequotas"]
        verbs: ["list"]
      # The model's token authentication, as the dashboard's "Require token
      # authentication" makes it: ServiceAccount <model>-sa, Role
      # <model>-view-role (get on that one model), RoleBinding <model>-view
      # and token Secret default-name-<model>-sa, each owned by the model.
      # create cannot be limited by name (Secrets create exists above);
      # get and delete only the catalog's names. get on these Secrets is
      # for "Can it be called?": the model's own token (it may only get that
      # one model) calls the model once after setup, never the user's or
      # this app's (the named get rules on other Secrets above already let
      # a leaked token create a token Secret of such a name and read it
      # back; SECURITY.md, "Which token is used where"). Delete is also what OpenShift's
      # OwnerReferencesPermissionEnforcement asks of whoever sets
      # ownerReferences. The Role and RoleBinding pass the RBAC escalation
      # check because this ServiceAccount holds get on those
      # LLMInferenceService names (the named rule above, and the unnamed
      # get/list the Playground's rules hold); it has no bind or escalate.
      # SECURITY.md audits each rule.
      - apiGroups: [""]
        resources: ["serviceaccounts"]
        verbs: ["create"]
      - apiGroups: [""]
        resources: ["serviceaccounts"]
        resourceNames: ["smollm2-135m-instruct-sa", "qwen25-05b-instruct-sa", "qwen3-1-7b-sa", "granite-embedding-125m-english-sa"]
        verbs: ["get", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["roles", "rolebindings"]
        verbs: ["create"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["roles"]
        resourceNames: ["smollm2-135m-instruct-view-role", "qwen25-05b-instruct-view-role", "qwen3-1-7b-view-role", "granite-embedding-125m-english-view-role"]
        verbs: ["get", "delete"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["rolebindings"]
        resourceNames: ["smollm2-135m-instruct-view", "qwen25-05b-instruct-view", "qwen3-1-7b-view", "granite-embedding-125m-english-view"]
        verbs: ["get", "delete"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["default-name-smollm2-135m-instruct-sa", "default-name-qwen25-05b-instruct-sa", "default-name-qwen3-1-7b-sa", "default-name-granite-embedding-125m-english-sa"]
        verbs: ["get", "delete"]
      # The dashboard's hardware profiles, to record the one that fits the
      # model as the deploy wizard does (Models). Read-only.
      - apiGroups: ["infrastructure.opendatahub.io"]
        resources: ["hardwareprofiles"]
        verbs: ["list"]
      # The Gen AI playground: the RHOAI dashboard's gen-ai API acts with the
      # caller's token (this ServiceAccount's). Its only gate is an access
      # review "list ogxservers in the project"; it then lists the project's
      # models (inferenceservices, llminferenceservices: get, list; the
      # list also finds the models that use the inference gateway), creates
      # OGXServer lsd-genai-playground and its ConfigMaps (create cannot be
      # limited by name), sets ownerReferences on them (which needs delete),
      # labels odh-trusted-ca-bundle ogx.io/watch=true (update), reads the
      # optional custom-endpoints ConfigMap, and deletes the server (this tool
      # also reads the server itself: its UID marks the one it requested). The
      # pgvector database and the router CA are the dashboard's own
      # ServiceAccount's. SECURITY.md audits each rule.
      - apiGroups: ["ogx.io"]
        resources: ["ogxservers"]
        verbs: ["list", "create"]
      - apiGroups: ["ogx.io"]
        resources: ["ogxservers"]
        resourceNames: ["lsd-genai-playground"]
        verbs: ["get", "delete"]
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["create"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["llama-stack-config", "ogx-office-mime-types", "ogx-router-ca-bundle", "ogx-trusted-ca-bundle"]
        verbs: ["get", "update", "delete"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["odh-trusted-ca-bundle"]
        verbs: ["get", "update"]
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["gen-ai-aa-custom-model-endpoints"]
        verbs: ["get"]
      - apiGroups: ["serving.kserve.io"]
        resources: ["inferenceservices", "llminferenceservices"]
        verbs: ["get", "list"]
      # Models as a Service (MaaS tab), as the MaaS install docs set it up.
      # The database: a CloudNativePG Cluster maas-db and the connection
      # Secret maas-db-config in the AI gateway's infrastructure namespace
      # (found at run time, created by RHOAI's operator, so cluster-wide but
      # only these names; Secret create is the existing rule above). The
      # CloudNativePG application Secret maas-db-app is read only by name,
      # to build the connection URL; no Secret is listed or watched.
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["clusters"]
        verbs: ["create"]
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["clusters"]
        resourceNames: ["maas-db"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["maas-db-config", "maas-db-app"]
        verbs: ["get"]
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["maas-db-config"]
        verbs: ["patch", "delete"]
      # Connectivity Link: the Kuadrant CR, created as platform-setup.md
      # does when there is none (create cannot be limited by name; never
      # changed or deleted), and Authorino's TLS as setup-authorino-tls.sh
      # sets it: only the Authorino CR "authorino" and its Service by name
      # (the namespace is the Kuadrant CR's, found at run time; the
      # Deployment patch is the existing deployments rule). SECURITY.md,
      # "MaaS one-click setup".
      - apiGroups: ["kuadrant.io"]
        resources: ["kuadrants"]
        verbs: ["list", "create"]
      - apiGroups: ["operator.authorino.kuadrant.io"]
        resources: ["authorinos"]
        resourceNames: ["authorino"]
        verbs: ["get", "patch"]
      - apiGroups: [""]
        resources: ["services"]
        resourceNames: ["authorino-authorino-authorization"]
        verbs: ["patch"]
      # The operators MaaS needs, installed as the MaaS docs install them
      # (Subscription create is the RHOAI rule above): only the
      # Subscriptions of Connectivity Link (kuadrant-operator, the docs'
      # name, or rhcl-operator, RHOAI-managed clusters') and CloudNativePG
      # (cloudnative-pg, in cnpg-system when this tool installs it) are read
      # and patched (channel for an upgrade, spec.config.resources after an
      # OOM kill, the docs' deny-on-failure env), never deleted
      - apiGroups: ["operators.coreos.com"]
        resources: ["subscriptions"]
        resourceNames: ["kuadrant-operator", "rhcl-operator", "cloudnative-pg"]
        verbs: ["get", "patch"]
      # The AI gateway's infrastructure namespace, which setup creates
      # before MaaS is on (scripts/setup-database.sh does); Remove deletes
      # it only when this tool created it and nothing else is in it
      - apiGroups: [""]
        resources: ["namespaces"]
        resourceNames: ["redhat-ai-gateway-infra", "odh-ai-gateway-infra"]
        verbs: ["delete"]
      # The default tenant the operator creates (read-only)
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["aitenants"]
        resourceNames: ["models-as-a-service"]
        verbs: ["get"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maastenantconfigs"]
        resourceNames: ["default-tenant"]
        verbs: ["get"]
      # Publishing the tool's chat models: their MaaSModelRefs (in the model's
      # project), and the tool's own MaaSSubscription and MaaSAuthPolicy (in
      # the tenant namespace models-as-a-service, which the MaaS controller
      # creates); create cannot be limited by name, the rest only these names
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasmodelrefs", "maassubscriptions", "maasauthpolicies"]
        verbs: ["create"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasmodelrefs"]
        resourceNames: ["smollm2-135m-instruct", "qwen25-05b-instruct", "qwen3-1-7b"]
        verbs: ["get", "patch", "delete"]
      # The HTTPRoutes KServe makes for the tool's chat models (in the
      # model's project), read-only: publishing waits until the model's names
      # the MaaS gateway alone, unpublishing until it has left it
      - apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        resourceNames: ["smollm2-135m-instruct-kserve-route", "qwen25-05b-instruct-kserve-route", "qwen3-1-7b-kserve-route"]
        verbs: ["get"]
      # Removing the platform: whether others use MaaS (their model
      # references, subscriptions and access policies; read-only)
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasmodelrefs", "maassubscriptions", "maasauthpolicies"]
        verbs: ["list"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maassubscriptions"]
        resourceNames: ["rhoai-nightly-updater-subscription"]
        verbs: ["get", "patch", "delete"]
      - apiGroups: ["maas.opendatahub.io"]
        resources: ["maasauthpolicies"]
        resourceNames: ["rhoai-nightly-updater-access"]
        verbs: ["get", "patch", "delete"]

  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
